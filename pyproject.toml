[project]
name = "terminal-radio"
version = "0.1.0"
description = "Cross-platform terminal radio player"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rcuev" }]
dependencies = [
    "textual>=0.80.0",
    "pydantic-settings>=2.3.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
audio = ["python-mpv>=1.0.7"]
fuzzy = ["rapidfuzz>=3.9.0"]
dev = ["pytest>=8.0.0"]
all = [
    "python-mpv>=1.0.7",
    "rapidfuzz>=3.9.0",
]

[project.scripts]
terminal-radio = "terminal_radio.__main__:main"
radio = "terminal_radio.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terminal_radio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
