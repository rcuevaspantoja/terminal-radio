name: Release Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Scoop and mpv
        shell: pwsh
        run: |
          Set-ExecutionPolicy Bypass -Scope Process -Force
          irm get.scoop.sh | iex
          scoop bucket add extras
          scoop install mpv

      - name: Build portable zip
        shell: pwsh
        run: ./packaging/windows/build.ps1 -DownloadMpv

      - name: Name release asset (Windows portable)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -match '^v') {
            $version = $tag.Substring(1)
            $assetName = "terminal-radio-$version-windows-x64-portable.zip"
          } else {
            $assetName = "terminal-radio-windows-x64-portable.zip"
          }
          $assetPath = Join-Path "dist" $assetName
          Move-Item -Force dist/TerminalRadio-win64.zip $assetPath
          "RELEASE_ASSET=$assetPath" >> $env:GITHUB_ENV
          "ASSET_FILENAME=$assetName" >> $env:GITHUB_ENV

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: terminal-radio-windows-x64-portable
          path: ${{ env.RELEASE_ASSET }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Terminal Radio ${{ github.ref_name }}
          files: ${{ env.RELEASE_ASSET }}
          generate_release_notes: true
          append_body: true
          body: |
            ## Downloads

            ### Windows — portable zip (x64)

            | Asset | Description |
            |-------|-------------|
            | **`${{ env.ASSET_FILENAME }}`** | Unzip anywhere and run `radio.exe`. Includes mpv. No Python or installer required. |

            **Quick start:** extract the zip → open the `TerminalRadio` folder → double-click `radio.exe`.

            ### Linux — `.deb` (Termux / TUR)

            | Asset | Description |
            |-------|-------------|
            | _Not in this release yet_ | A future workflow will attach a `.deb` to the same release page. |

            ---

            ### Changelog
